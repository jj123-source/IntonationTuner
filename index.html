<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Guitar Intonation & Chromatic Tuner</title>
<style>
:root {
--bg: #0f172a;
--card: #1e293b;
--accent: #38bdf8;
--success: #22c55e;
--warning: #f59e0b;
--danger: #ef4444;
--text: #f8fafc;
--subtext: #94a3b8;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 1.5rem; }
header { text-align: center; margin-bottom: 1.5rem; }
h1 { font-size: 1.75rem; color: var(--accent); }
p.subtitle { font-size: 0.9rem; color: var(--subtext); margin-top: 0.25rem; }
.container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 1.25rem; }
.card { background: var(--card); border-radius: 12px; padding: 1.25rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); text-align: center; }
/* Display / Meter */
.note-display { font-size: 3.5rem; font-weight: 800; line-height: 1; margin: 0.5rem 0; }
.freq-info { font-size: 1rem; color: var(--subtext); display: flex; justify-content: space-around; margin-top: 0.5rem; }
canvas { width: 100%; height: 140px; display: block; margin: 1rem 0; }
/* Controls */
.controls { display: flex; gap: 0.75rem; justify-content: center; }
button { background: var(--accent); color: #000; border: none; padding: 0.75rem 1.25rem; font-weight: 700; border-radius: 8px; cursor: pointer; transition: opacity 0.2s; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
button.active { background: var(--success); color: #fff; }
/* Intonation Assistant */
.wizard-step { margin-top: 1rem; padding: 1rem; background: rgba(255,255,255,0.05); border-radius: 8px; text-align: left; }
.wizard-step h3 { font-size: 1rem; color: var(--accent); margin-bottom: 0.5rem; }
.wiz-readings { display: flex; justify-content: space-between; margin: 0.75rem 0; }
.wiz-box { background: rgba(0,0,0,0.2); padding: 0.5rem 0.75rem; border-radius: 6px; text-align: center; flex: 1; margin: 0 0.25rem; }
.wiz-box .label { font-size: 0.75rem; color: var(--subtext); }
.wiz-box .val { font-size: 1.1rem; font-weight: bold; margin-top: 0.2rem; }
.action-badge { padding: 0.75rem; border-radius: 8px; font-weight: bold; text-align: center; margin-top: 0.75rem; display: none; }
.action-sharp { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }
.action-flat { background: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid var(--warning); }
.action-good { background: rgba(34, 197, 94, 0.2); color: var(--success); border: 1px solid var(--success); }
</style>
</head>
<body>
<header>
<h1>Precision Intonation Tuner</h1>
<p class="subtitle">High-accuracy sub-cent pitch detector</p>
</header>
<div class="container">
<!-- Tuner Card -->
<div class="card">
<div class="controls">
<button id="startBtn">Start Tuner</button>
</div>
<div class="note-display" id="noteName">--</div>
<canvas id="gaugeCanvas" width="400" height="140"></canvas>
<div class="freq-info">
<span>Detected: <strong id="detectedFreq">0.0 Hz</strong></span>
<span>Target: <strong id="targetFreq">0.0 Hz</strong></span>
</div>
</div>
<!-- Intonation Assistant -->
<div class="card">
<h2>Intonation Assistant</h2>
<p class="subtitle">Compare Open String vs. 12th Fret Fretted Pitch</p>
<div class="wizard-step">
<div class="wiz-readings">
<div class="wiz-box">
<div class="label">Open Pitch</div>
<div class="val" id="openPitchVal">--</div>
</div>
<div class="wiz-box">
<div class="label">12th Fret Pitch</div>
<div class="val" id="fret12PitchVal">--</div>
</div>
</div>
<div style="display: flex; gap: 0.5rem; margin-top: 0.75rem;">
<button id="lockOpenBtn" style="flex:1" disabled>Lock Open</button>
<button id="lock12Btn" style="flex:1" disabled>Lock 12th Fret</button>
<button id="resetWizBtn" style="background: #475569; color: #fff;">Reset</button>
</div>
<div id="actionBadge" class="action-badge"></div>
</div>
</div>
</div>
<script>
let audioCtx, analyser, micStream;
let isListening = false;
let animFrameId = null;
const startBtn = document.getElementById('startBtn');
const noteNameEl = document.getElementById('noteName');
const detectedFreqEl = document.getElementById('detectedFreq');
const targetFreqEl = document.getElementById('targetFreq');
const canvas = document.getElementById('gaugeCanvas');
const ctx = canvas.getContext('2d');
// Intonation Wizard elements
const lockOpenBtn = document.getElementById('lockOpenBtn');
const lock12Btn = document.getElementById('lock12Btn');
const resetWizBtn = document.getElementById('resetWizBtn');
const openPitchVal = document.getElementById('openPitchVal');
const fret12PitchVal = document.getElementById('fret12PitchVal');
const actionBadge = document.getElementById('actionBadge');
// Frequency & Cent state variables
let rawFreq = 0;
let smoothedFreq = 0;
let smoothedCents = 0;
let lockedOpenFreq = null;
let locked12Freq = null;
// Tuning & Throttling Configuration
const SMOOTHING_FACTOR = 0.15; // Controls needle/pitch responsiveness (0.1 = smooth, 0.3 = fast)
let lastTextUpdate = 0;
const TEXT_UPDATE_INTERVAL_MS = 100; // Limits text updates to 10 fps to prevent flicker
const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
startBtn.addEventListener('click', async () => {
if (!isListening) {
await initAudio();
} else {
stopAudio();
}
});
async function initAudio() {
try {
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
micStream = await navigator.mediaDevices.getUserMedia({
audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
});
const source = audioCtx.createMediaStreamSource(micStream);
analyser = audioCtx.createAnalyser();
analyser.fftSize = 4096;
source.connect(analyser);
isListening = true;
smoothedFreq = 0;
smoothedCents = 0;
startBtn.textContent = 'Stop Tuner';
startBtn.classList.add('active');
lockOpenBtn.disabled = false;
lock12Btn.disabled = false;
updatePitch();
} catch (err) {
alert('Could not access microphone: ' + err.message);
}
}
function stopAudio() {
if (animFrameId) {
cancelAnimationFrame(animFrameId);
animFrameId = null;
}
if (micStream) {
micStream.getTracks().forEach(track => track.stop());
micStream = null;
}
if (audioCtx && audioCtx.state !== 'closed') {
audioCtx.close();
}
isListening = false;
startBtn.textContent = 'Start Tuner';
startBtn.classList.remove('active');
lockOpenBtn.disabled = true;
lock12Btn.disabled = true;
noteNameEl.textContent = '--';
drawGauge(0);
}
// Handle page unload cleanly
window.addEventListener('pagehide', () => stopAudio());
window.addEventListener('beforeunload', () => stopAudio());
// Autocorrelation Pitch Detection algorithm
function autoCorrelate(buffer, sampleRate) {
let SIZE = buffer.length;
let rms = 0;
for (let i = 0; i < SIZE; i++) {
let val = buffer[i];
rms += val * val;
}
rms = Math.sqrt(rms / SIZE);
if (rms < 0.01) return -1;
let r1 = 0, r2 = SIZE - 1, thres = 0.2;
for (let i = 0; i < SIZE / 2; i++) {
if (Math.abs(buffer[i]) < thres) { r1 = i; break; }
}
for (let i = 1; i < SIZE / 2; i++) {
if (Math.abs(buffer[SIZE - i]) < thres) { r2 = SIZE - i; break; }
}
buffer = buffer.slice(r1, r2);
SIZE = buffer.length;
let c = new Float32Array(SIZE);
for (let i = 0; i < SIZE; i++) {
for (let j = 0; j < SIZE - i; j++) {
c[i] = c[i] + buffer[j] * buffer[j + i];
}
}
let d = 0;
while (c[d] > c[d + 1]) d++;
let maxval = -1, maxpos = -1;
for (let i = d; i < SIZE; i++) {
if (c[i] > maxval) {
maxval = c[i];
maxpos = i;
}
}
let T0 = maxpos;
let x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
let a = (x1 + x3 - 2 * x2) / 2;
let b = (x3 - x1) / 2;
if (a) T0 = T0 - b / (2 * a);
return sampleRate / T0;
}
function updatePitch() {
if (!isListening) return;
const buffer = new Float32Array(analyser.fftSize);
analyser.getFloatTimeDomainData(buffer);
const pitch = autoCorrelate(buffer, audioCtx.sampleRate);
const now = performance.now();
if (pitch !== -1 && pitch >= 60 && pitch <= 1200) {
// Exponential Moving Average (EMA) for frequency
if (smoothedFreq === 0) {
smoothedFreq = pitch;
} else {
smoothedFreq = smoothedFreq + SMOOTHING_FACTOR * (pitch - smoothedFreq);
}
const midiNum = 69 + 12 * Math.log2(smoothedFreq / 440);
const nearestMidi = Math.round(midiNum);
const noteIndex = (nearestMidi % 12 + 12) % 12;
const targetPitch = 440 * Math.pow(2, (nearestMidi - 69) / 12);
const rawCents = 1200 * Math.log2(smoothedFreq / targetPitch);
smoothedCents = smoothedCents + SMOOTHING_FACTOR * (rawCents - smoothedCents);
// Throttle frequency and note text updating
if (now - lastTextUpdate > TEXT_UPDATE_INTERVAL_MS) {
noteNameEl.textContent = NOTE_NAMES[noteIndex];
detectedFreqEl.textContent = smoothedFreq.toFixed(2) + ' Hz';
targetFreqEl.textContent = targetPitch.toFixed(2) + ' Hz';
lastTextUpdate = now;
}
// Gauge needle renders smoothly every animation frame
drawGauge(Math.round(smoothedCents));
} else {
drawGauge(Math.round(smoothedCents));
}
animFrameId = requestAnimationFrame(updatePitch);
}
function drawGauge(cents) {
ctx.clearRect(0, 0, canvas.width, canvas.height);
const centerX = canvas.width / 2;
const centerY = 120;
const radius = 90;
// Outer Arc
ctx.beginPath();
ctx.arc(centerX, centerY, radius, Math.PI, 2 * Math.PI);
ctx.lineWidth = 6;
ctx.strokeStyle = '#334155';
ctx.stroke();
// Zero Marker
ctx.beginPath();
ctx.moveTo(centerX, centerY - radius - 8);
ctx.lineTo(centerX, centerY - radius + 8);
ctx.lineWidth = 3;
ctx.strokeStyle = '#22c55e';
ctx.stroke();
const clampedCents = Math.max(-50, Math.min(50, cents));
const angle = (clampedCents / 50) * (Math.PI / 4) - (Math.PI / 2);
const needleX = centerX + radius * Math.cos(angle);
const needleY = centerY + radius * Math.sin(angle);
// Gauge Needle
ctx.beginPath();
ctx.moveTo(centerX, centerY);
ctx.lineTo(needleX, needleY);
ctx.lineWidth = 4;
ctx.strokeStyle = Math.abs(clampedCents) <= 3 ? '#22c55e' : (clampedCents > 0 ? '#ef4444' : '#f59e0b');
ctx.stroke();
// Cents readout text
ctx.fillStyle = '#f8fafc';
ctx.font = 'bold 16px sans-serif';
ctx.textAlign = 'center';
ctx.fillText((cents > 0 ? '+' : '') + cents + ' Cents', centerX, centerY - 20);
}
// Lock smoothed values for intonation checking
lockOpenBtn.addEventListener('click', () => {
if (smoothedFreq > 0) {
lockedOpenFreq = smoothedFreq;
openPitchVal.textContent = smoothedFreq.toFixed(2) + ' Hz';
evaluateIntonation();
}
});
lock12Btn.addEventListener('click', () => {
if (smoothedFreq > 0) {
locked12Freq = smoothedFreq;
fret12PitchVal.textContent = smoothedFreq.toFixed(2) + ' Hz';
evaluateIntonation();
}
});
resetWizBtn.addEventListener('click', () => {
lockedOpenFreq = null;
locked12Freq = null;
openPitchVal.textContent = '--';
fret12PitchVal.textContent = '--';
actionBadge.style.display = 'none';
});
function evaluateIntonation() {
if (!lockedOpenFreq || !locked12Freq) return;
const expected12Freq = lockedOpenFreq * 2;
const centDiff = Math.round(1200 * Math.log2(locked12Freq / expected12Freq));
actionBadge.style.display = 'block';
actionBadge.className = 'action-badge';
if (Math.abs(centDiff) <= 2) {
actionBadge.classList.add('action-good');
actionBadge.innerHTML = 'Intonation Accurate! (' + centDiff + ' cents)';
} else if (centDiff > 2) {
actionBadge.classList.add('action-sharp');
actionBadge.innerHTML = '12th Fret is SHARP (' + centDiff + ' cents)
Move saddle BACK (away from neck)';
} else {
actionBadge.classList.add('action-flat');
actionBadge.innerHTML = '12th Fret is FLAT (' + centDiff + ' cents)
Move saddle FORWARD (towards neck)';
}
}
drawGauge(0);
</script>
</body>
</html>
